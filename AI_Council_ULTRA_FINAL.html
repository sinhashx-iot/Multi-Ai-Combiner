<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AI Mediator & Problem Analyzer</title>
<!-- PDF.js library for in-browser PDF text extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{
  --bg:#070b14;--panel:#0e1524;--panel2:#121c2f;--text:#eef4ff;--muted:#93a4bd;
  --line:#22304a;--accent:#7c5cff;--accent2:#19d3ae;--danger:#ff5d73;--warn:#ffc857;
  --shadow:0 16px 45px rgba(0,0,0,.32);--radius:20px
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% -10%,#18234b 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;margin:auto;padding:18px 14px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#19d3ae);font-size:24px;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:rgba(14,21,36,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 8px}
textarea,input,select{width:100%;background:#09111f;color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none;padding:13px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.file-box{margin:10px 0;display:flex;align-items:center;gap:10px}
.file-box input[type="file"]{display:none}
.file-label{border:1px dashed var(--line);padding:10px 14px;border-radius:12px;cursor:pointer;background:#09111f;font-size:12px;color:var(--muted)}
.file-preview{font-size:12px;color:var(--accent2)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.primary{border:0;background:linear-gradient(135deg,#7c5cff,#6045df);color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;flex:1;min-width:200px}
.secondary{border:1px solid var(--line);background:#0a1220;color:#fff;border-radius:14px;padding:13px 16px}
.engine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.engine-checkbox{display:flex;align-items:center;gap:8px;background:#09111f;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.engine-checkbox input{width:auto;margin:0}
.hidden{display:none!important}
.synthesis-card{border:2px solid var(--accent2);background:#0b1b22;border-radius:16px;padding:20px;margin-top:20px}
.synthesis-card h3{color:var(--accent2);margin-top:0}
.synth-body{line-height:1.6;font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111b2d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;font-size:12px}
.helper-link{color:var(--accent2);font-size:12px;text-decoration:none;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">⚖️</div>
    <div><h1>AI Mediator & Multi-Search</h1><div class="sub">Groq Llama 3 Powered • Automated Problem Synthesis</div></div>
  </div>
</header>

<div class="card">
  <label for="prompt">ENTER PROMPT OR HACKATHON QUESTION</label>
  <textarea id="prompt" placeholder="Analyze Problem statements 26115 to 26172 and give me only 2 problem statements..."></textarea>

  <div class="file-box">
    <label for="fileInput" class="file-label">📎 Attach PDF / Text File</label>
    <input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.pdf">
    <span class="file-preview" id="fileName">No file attached</span>
  </div>

  <div class="actions">
    <button class="primary" id="mediatorBtn">🧠 RUN MEDIATOR (GROQ SYNTHESIS)</button>
    <button class="secondary" id="openTabsBtn">🚀 Open Search Tabs Direct</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
</div>

<div class="card">
  <label>SELECT SEARCH ENGINES FOR DIRECT OPENING</label>
  <div class="engine-grid">
    <label class="engine-checkbox"><input type="checkbox" id="engineGoogle" checked> Google Search</label>
    <label class="engine-checkbox"><input type="checkbox" id="enginePerplexity" checked> Perplexity AI</label>
    <label class="engine-checkbox"><input type="checkbox" id="engineChatGPT" checked> ChatGPT</label>
    <label class="engine-checkbox"><input type="checkbox" id="engineDDG" checked> DuckDuckGo</label>
  </div>
</div>

<div class="card">
  <label for="groqModel">SELECT GROQ MODEL (100% FREE)</label>
  <select id="groqModel" style="margin-bottom: 12px;">
    <option value="llama-3.3-70b-versatile" selected>Llama 3.3 70B Versatile (Recommended)</option>
    <option value="llama3-8b-8192">Llama 3 8B (Fast)</option>
    <option value="mixtral-8x7b-32768">Mixtral 8x7b (Large Context)</option>
  </select>

  <label for="apiKey">FREE GROQ API KEY</label>
  <input type="password" id="apiKey" placeholder="gsk_...">
  <a href="https://console.groq.com/keys" target="_blank" class="helper-link">👉 Click here to get a 100% Free Groq API Key (No credit card required)</a>
</div>

<!-- FINAL RESULTS DISPLAY -->
<section id="synthesisResult" class="hidden">
  <div class="synthesis-card">
    <h3>🏆 FINAL MEDIATOR ANALYSIS</h3>
    <div class="synth-body" id="synthesisText">Analyzing data...</div>
  </div>
</section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

let attachedFileContent = "";

const $ = id => document.getElementById(id);

function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.remove("hidden");
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => $("toast").classList.add("hidden"), 3000);
}

// Extract PDF text directly in-browser
$("fileInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  
  $("fileName").textContent = file.name + " (Reading PDF...)";

  if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = "";
      
      for (let i = 1; i <= Math.min(pdf.numPages, 25); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      
      attachedFileContent = `\n[ATTACHED CATALOG DATA (${file.name}):\n${text}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
      toast("PDF parsed successfully!");
    } catch (err) {
      toast("Failed to parse PDF file.");
      $("fileName").textContent = "Error reading PDF";
    }
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFileContent = `\n[ATTACHED FILE DATA:\n${reader.result}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
    };
    reader.readAsText(file);
  }
};

// Open Selected Engines in Web Tabs
function openSearchTabs() {
  const query = encodeURIComponent($("prompt").value.trim());
  if (!query) return toast("Enter a prompt first to search across engines.");

  if ($("engineGoogle").checked) window.open(`https://www.google.com/search?q=${query}`, '_blank');
  if ($("enginePerplexity").checked) window.open(`https://www.perplexity.ai/search?q=${query}`, '_blank');
  if ($("engineChatGPT").checked) window.open(`https://chatgpt.com/?q=${query}`, '_blank');
  if ($("engineDDG").checked) window.open(`https://duckduckgo.com/?q=${query}`, '_blank');
}

// Execute Direct AI Synthesis via Groq API
async function runMediator() {
  const rawQuery = $("prompt").value.trim();
  if (!rawQuery) return toast("Please enter your prompt first.");
  
  const apiKey = $("apiKey").value.trim();
  if (!apiKey) {
    return toast("Please paste your free Groq API key below.");
  }

  const selectedModel = $("groqModel").value;

  $("synthesisResult").classList.remove("hidden");
  $("synthesisText").textContent = `📡 Processing request via Groq (${selectedModel})...`;

  const fullPrompt = rawQuery + attachedFileContent;

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: selectedModel,
        messages: [
          { 
            role: "system", 
            content: "You are an expert hackathon advisor and technical evaluator. Analyze the user prompt and any provided catalogue content concisely and give actionable recommendations." 
          },
          { 
            role: "user", 
            content: fullPrompt 
          }
        ],
        temperature: 0.5
      })
    });

    const data = await response.json();

    if (data.error) {
      $("synthesisText").textContent = "Groq API Error: " + data.error.message;
      return;
    }

    const outputText = data.choices?.[0]?.message?.content || "No response generated.";
    $("synthesisText").textContent = outputText;

  } catch (err) {
    $("synthesisText").textContent = "Execution Error: " + err.message;
  }
}

// Event Listeners
$("mediatorBtn").onclick = runMediator;
$("openTabsBtn").onclick = openSearchTabs;
$("clearBtn").onclick = () => {
  $("prompt").value = "";
  $("fileInput").value = "";
  $("fileName").textContent = "No file attached";
  attachedFileContent = "";
  $("synthesisResult").classList.add("hidden");
};

// Load saved key from localStorage
$("apiKey").value = localStorage.getItem("free_groq_key") || "";
$("apiKey").onchange = e => localStorage.setItem("free_groq_key", e.target.value.trim());

})();
</script>
</body>
</html>
