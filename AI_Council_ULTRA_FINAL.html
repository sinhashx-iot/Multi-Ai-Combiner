<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AI Mediator & Multi-Search</title>
<!-- PDF.js library for in-browser PDF text extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{
  --bg:#070b14;--panel:#0e1524;--panel2:#121c2f;--text:#eef4ff;--muted:#93a4bd;
  --line:#22304a;--accent:#7c5cff;--accent2:#19d3ae;--danger:#ff5d73;--warn:#ffc857;
  --shadow:0 16px 45px rgba(0,0,0,.32);--radius:20px
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% -10%,#18234b 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;margin:auto;padding:18px 14px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#19d3ae);font-size:24px;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:rgba(14,21,36,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 8px}
textarea,input,select{width:100%;background:#09111f;color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none;padding:13px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.file-box{margin:10px 0;display:flex;align-items:center;gap:10px}
.file-box input[type="file"]{display:none}
.file-label{border:1px dashed var(--line);padding:10px 14px;border-radius:12px;cursor:pointer;background:#09111f;font-size:12px;color:var(--muted)}
.file-preview{font-size:12px;color:var(--accent2)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.primary{border:0;background:linear-gradient(135deg,#7c5cff,#6045df);color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;flex:1;min-width:200px}
.secondary{border:1px solid var(--line);background:#0a1220;color:#fff;border-radius:14px;padding:13px 16px}
.danger-btn{border:1px solid var(--danger);background:rgba(255,93,115,0.1);color:var(--danger);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer}
.engine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.engine-checkbox{display:flex;align-items:center;justify-content:space-between;background:#09111f;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.engine-checkbox-left{display:flex;align-items:center;gap:8px}
.engine-checkbox input{width:auto;margin:0}
.add-engine-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add-engine-row input{padding:9px 12px;font-size:12px;flex:1;min-width:180px}
.hidden{display:none!important}
.synthesis-card{border:2px solid var(--accent2);background:#0b1b22;border-radius:16px;padding:20px;margin-top:20px}
.synthesis-card h3{color:var(--accent2);margin-top:0}
.synth-body{line-height:1.6;font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111b2d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;font-size:12px}
.helper-link{color:var(--accent2);font-size:12px;text-decoration:none;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">⚖️</div>
    <div><h1>AI Mediator & Multi-Search</h1><div class="sub">Dynamic Auto-Model Groq Engine • Unlimited Multi-Search</div></div>
  </div>
</header>

<div class="card">
  <label for="prompt">ENTER PROMPT OR HACKATHON QUESTION</label>
  <textarea id="prompt" placeholder="Analyze Problem statements 26115 to 26172 and give me only 2 problem statements..."></textarea>

  <div class="file-box">
    <label for="fileInput" class="file-label">📎 Attach PDF / Text File</label>
    <input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.pdf">
    <span class="file-preview" id="fileName">No file attached</span>
  </div>

  <div class="actions">
    <button class="primary" id="mediatorBtn">🧠 RUN MEDIATOR (GROQ SYNTHESIS)</button>
    <button class="secondary" id="openTabsBtn">🚀 Open All Selected Search Tabs</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
</div>

<!-- UNLIMITED SEARCH ENGINES SECTION -->
<div class="card">
  <label>SELECT / ADD SEARCH ENGINES (UNLIMITED)</label>
  <div class="engine-grid" id="engineGrid">
    <!-- Search engine checkboxes render dynamically here -->
  </div>

  <div class="add-engine-row">
    <input type="text" id="newEngineName" placeholder="Engine Name (e.g. Bing)">
    <input type="text" id="newEngineUrl" placeholder="Search URL (e.g. https://www.bing.com/search?q=)">
    <button class="secondary" id="addEngineBtn" style="white-space:nowrap;">+ Add Engine</button>
  </div>
</div>

<div class="card">
  <label for="apiKey">FREE GROQ API KEY</label>
  <input type="password" id="apiKey" placeholder="gsk_...">
  <a href="https://console.groq.com/keys" target="_blank" class="helper-link">👉 Click here to get a 100% Free Groq API Key (No credit card required)</a>

  <div style="margin-top:14px;">
    <label for="groqModel">SELECT ACTIVE GROQ MODEL (AUTO-FETCHED)</label>
    <select id="groqModel">
      <option value="">Paste API Key above to load active models...</option>
    </select>
  </div>
</div>

<!-- FINAL RESULTS DISPLAY -->
<section id="synthesisResult" class="hidden">
  <div class="synthesis-card">
    <h3>🏆 FINAL MEDIATOR ANALYSIS</h3>
    <div class="synth-body" id="synthesisText">Analyzing data...</div>
  </div>
</section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

let attachedFileContent = "";

const $ = id => document.getElementById(id);

// Unlimited Search Engines Setup
const defaultEngines = [
  { id: 'google', name: 'Google Search', url: 'https://www.google.com/search?q=', enabled: true },
  { id: 'perplexity', name: 'Perplexity AI', url: 'https://www.perplexity.ai/search?q=', enabled: true },
  { id: 'chatgpt', name: 'ChatGPT', url: 'https://chatgpt.com/?q=', enabled: true },
  { id: 'ddg', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=', enabled: true },
  { id: 'github', name: 'GitHub Code', url: 'https://github.com/search?q=', enabled: false },
  { id: 'phind', name: 'Phind AI', url: 'https://www.phind.com/search?q=', enabled: false }
];

let customEngines = JSON.parse(localStorage.getItem('user_search_engines')) || defaultEngines;

function saveEngines() {
  localStorage.setItem('user_search_engines', JSON.stringify(customEngines));
}

function renderEngines() {
  const container = $("engineGrid");
  container.innerHTML = "";
  
  customEngines.forEach((engine, index) => {
    const card = document.createElement("div");
    card.className = "engine-checkbox";
    card.innerHTML = `
      <div class="engine-checkbox-left">
        <input type="checkbox" id="engine_chk_${index}" ${engine.enabled ? 'checked' : ''}>
        <label for="engine_chk_${index}" style="margin:0;cursor:pointer;">${engine.name}</label>
      </div>
      <button class="danger-btn" data-index="${index}">✕</button>
    `;

    card.querySelector('input').onchange = (e) => {
      customEngines[index].enabled = e.target.checked;
      saveEngines();
    };

    card.querySelector('.danger-btn').onclick = () => {
      customEngines.splice(index, 1);
      saveEngines();
      renderEngines();
    };

    container.appendChild(card);
  });
}

function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.remove("hidden");
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => $("toast").classList.add("hidden"), 3000);
}

// Add New Unlimited Engines
$("addEngineBtn").onclick = () => {
  const name = $("newEngineName").value.trim();
  const url = $("newEngineUrl").value.trim();

  if (!name || !url) return toast("Provide both engine name and query URL.");

  customEngines.push({
    id: 'custom_' + Date.now(),
    name: name,
    url: url,
    enabled: true
  });

  saveEngines();
  renderEngines();

  $("newEngineName").value = "";
  $("newEngineUrl").value = "";
  toast(`Added engine: ${name}`);
};

// Open Selected Search Tabs
function openSearchTabs() {
  const query = encodeURIComponent($("prompt").value.trim());
  if (!query) return toast("Enter a prompt first to search across engines.");

  let openedCount = 0;
  customEngines.forEach(engine => {
    if (engine.enabled) {
      window.open(`${engine.url}${query}`, '_blank');
      openedCount++;
    }
  });

  if (openedCount === 0) toast("Select at least one search engine checkbox.");
}

// Auto Fetch Available Models from user's Groq Account
async function fetchActiveModels() {
  const apiKey = $("apiKey").value.trim();
  if (!apiKey) return;

  const select = $("groqModel");
  select.innerHTML = "<option value=''>Fetching available models from Groq...</option>";

  try {
    const res = await fetch("https://api.groq.com/openai/v1/models", {
      method: "GET",
      headers: { "Authorization": `Bearer ${apiKey}` }
    });
    
    const data = await res.json();
    if (data.data && Array.isArray(data.data)) {
      select.innerHTML = "";
      data.data.forEach(m => {
        const option = document.createElement("option");
        option.value = m.id;
        option.textContent = m.id;
        select.appendChild(option);
      });
      toast("Loaded active models for your Groq account!");
    } else {
      select.innerHTML = "<option value=''>Invalid Key or Failed to load models</option>";
    }
  } catch (err) {
    select.innerHTML = "<option value=''>Error fetching active models</option>";
  }
}

// Extract PDF text directly in-browser
$("fileInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  
  $("fileName").textContent = file.name + " (Reading PDF...)";

  if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = "";
      
      for (let i = 1; i <= Math.min(pdf.numPages, 25); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      
      attachedFileContent = `\n[ATTACHED CATALOG DATA (${file.name}):\n${text}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
      toast("PDF parsed successfully!");
    } catch (err) {
      toast("Failed to parse PDF file.");
      $("fileName").textContent = "Error reading PDF";
    }
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFileContent = `\n[ATTACHED FILE DATA:\n${reader.result}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
    };
    reader.readAsText(file);
  }
};

// Execute Direct AI Synthesis via Groq API
async function runMediator() {
  const rawQuery = $("prompt").value.trim();
  if (!rawQuery) return toast("Please enter your prompt first.");
  
  const apiKey = $("apiKey").value.trim();
  if (!apiKey) return toast("Please paste your free Groq API key below.");

  const selectedModel = $("groqModel").value;
  if (!selectedModel) return toast("Please select an active model from the dropdown.");

  $("synthesisResult").classList.remove("hidden");
  $("synthesisText").textContent = `📡 Processing request via Groq (${selectedModel})...`;

  const fullPrompt = rawQuery + attachedFileContent;

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: selectedModel,
        messages: [
          { 
            role: "system", 
            content: "You are an expert hackathon advisor and technical evaluator. Analyze the prompt and catalogue data accurately." 
          },
          { 
            role: "user", 
            content: fullPrompt 
          }
        ],
        temperature: 0.5
      })
    });

    const data = await response.json();

    if (data.error) {
      $("synthesisText").textContent = "Groq API Error: " + data.error.message;
      return;
    }

    const outputText = data.choices?.[0]?.message?.content || "No response generated.";
    $("synthesisText").textContent = outputText;

  } catch (err) {
    $("synthesisText").textContent = "Execution Error: " + err.message;
  }
}

// Event Listeners
$("mediatorBtn").onclick = runMediator;
$("openTabsBtn").onclick = openSearchTabs;
$("clearBtn").onclick = () => {
  $("prompt").value = "";
  $("fileInput").value = "";
  $("fileName").textContent = "No file attached";
  attachedFileContent = "";
  $("synthesisResult").classList.add("hidden");
};

// Load saved key from localStorage & dynamic model fetching
$("apiKey").value = localStorage.getItem("free_groq_key") || "";
$("apiKey").onchange = e => {
  localStorage.setItem("free_groq_key", e.target.value.trim());
  fetchActiveModels();
};

// Initial setup
renderEngines();
if ($("apiKey").value.trim()) {
  fetchActiveModels();
}

})();
</script>
</body>
</html>
