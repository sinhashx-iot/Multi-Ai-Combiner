<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AI Mediator & Problem Analyzer</title>
<!-- PDF.js library to extract PDF text in-browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{
  --bg:#070b14;--panel:#0e1524;--panel2:#121c2f;--text:#eef4ff;--muted:#93a4bd;
  --line:#22304a;--accent:#7c5cff;--accent2:#19d3ae;--danger:#ff5d73;--warn:#ffc857;
  --shadow:0 16px 45px rgba(0,0,0,.32);--radius:20px
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% -10%,#18234b 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;margin:auto;padding:18px 14px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#19d3ae);font-size:24px;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:rgba(14,21,36,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 8px}
textarea,input{width:100%;background:#09111f;color:var(--text);border:1px solid var(--line);border-radius:14px;outline:none;padding:13px}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{border-color:var(--accent)}
.file-box{margin:10px 0;display:flex;align-items:center;gap:10px}
.file-box input[type="file"]{display:none}
.file-label{border:1px dashed var(--line);padding:10px 14px;border-radius:12px;cursor:pointer;background:#09111f;font-size:12px;color:var(--muted)}
.file-preview{font-size:12px;color:var(--accent2)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.primary{border:0;background:linear-gradient(135deg,#7c5cff,#6045df);color:#fff;border-radius:14px;padding:14px 20px;font-weight:800;flex:1;min-width:200px}
.secondary{border:1px solid var(--line);background:#0a1220;color:#fff;border-radius:14px;padding:13px 16px}
.hidden{display:none!important}
.synthesis-card{border:2px solid var(--accent2);background:#0b1b22;border-radius:16px;padding:20px;margin-top:20px}
.synthesis-card h3{color:var(--accent2);margin-top:0}
.synth-body{line-height:1.6;font-size:14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111b2d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;font-size:12px}
.helper-link{color:var(--accent2);font-size:12px;text-decoration:none;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">⚖️</div>
    <div><h1>AI Mediator & Multi-Search</h1><div class="sub">Direct Analysis & In-App Synthesis</div></div>
  </div>
</header>

<div class="card">
  <label for="prompt">ENTER PROMPT OR HACKATHON QUESTION</label>
  <textarea id="prompt" placeholder="Analyze problem statements..."></textarea>

  <div class="file-box">
    <label for="fileInput" class="file-label">📎 Attach PDF / Text File</label>
    <input type="file" id="fileInput" accept="image/*,.txt,.md,.json,.csv,.pdf">
    <span class="file-preview" id="fileName">No file attached</span>
  </div>

  <div class="actions">
    <button class="primary" id="mediatorBtn">🧠 RUN MEDIATOR (FREE AUTOMATED SYNTHESIS)</button>
    <button class="secondary" id="clearBtn">Clear</button>
  </div>
</div>

<div class="card">
  <label for="apiKey">FREE GOOGLE GEMINI API KEY</label>
  <input type="password" id="apiKey" placeholder="AIzaSy...">
  <a href="https://aistudio.google.com/app/apikey" target="_blank" class="helper-link">👉 Click here to get a 100% Free Gemini API Key (No credit card required)</a>
</div>

<!-- FINAL RESULTS DISPLAY -->
<section id="synthesisResult" class="hidden">
  <div class="synthesis-card">
    <h3>🏆 FINAL MEDIATOR ANALYSIS</h3>
    <div class="synth-body" id="synthesisText">Analyzing data...</div>
  </div>
</section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

let attachedFileContent = "";

const $ = id => document.getElementById(id);

function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.remove("hidden");
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => $("toast").classList.add("hidden"), 3000);
}

// Extract PDF text directly in-browser
$("fileInput").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  
  $("fileName").textContent = file.name + " (Reading PDF...)";

  if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = "";
      
      for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(" ") + "\n";
      }
      
      attachedFileContent = `\n[ATTACHED CATALOG DATA (${file.name}):\n${text}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
      toast("PDF parsed successfully!");
    } catch (err) {
      toast("Failed to parse PDF file.");
      $("fileName").textContent = "Error reading PDF";
    }
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFileContent = `\n[ATTACHED FILE DATA:\n${reader.result}\n]`;
      $("fileName").textContent = file.name + " (Ready)";
    };
    reader.readAsText(file);
  }
};

// Execute Direct AI Analysis using the reliable gemini-flash-latest alias
async function runMediator() {
  const rawQuery = $("prompt").value.trim();
  if (!rawQuery) return toast("Please enter your prompt first.");
  
  const apiKey = $("apiKey").value.trim();
  if (!apiKey) {
    return toast("Please paste your free Gemini API key below.");
  }

  $("synthesisResult").classList.remove("hidden");
  $("synthesisText").textContent = "📡 Processing prompt and catalog data via Gemini API...";

  const fullPrompt = rawQuery + attachedFileContent;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [{ text: fullPrompt }]
        }]
      })
    });

    const data = await response.json();

    if (data.error) {
      $("synthesisText").textContent = "API Error: " + data.error.message;
      return;
    }

    const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response text generated.";
    $("synthesisText").textContent = outputText;

  } catch (err) {
    $("synthesisText").textContent = "Execution Error: " + err.message;
  }
}

// Event Listeners
$("mediatorBtn").onclick = runMediator;
$("clearBtn").onclick = () => {
  $("prompt").value = "";
  $("fileInput").value = "";
  $("fileName").textContent = "No file attached";
  attachedFileContent = "";
  $("synthesisResult").classList.add("hidden");
};

// Load saved key from localStorage
$("apiKey").value = localStorage.getItem("free_gemini_key") || "";
$("apiKey").onchange = e => localStorage.setItem("free_gemini_key", e.target.value.trim());

})();
</script>
</body>
</html>
